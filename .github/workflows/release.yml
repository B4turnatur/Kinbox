# Baut Kinbox.exe + Erweiterungs-ZIP und legt ein GitHub-Release an, sobald ein Tag wie v3.3.0 gepusht wird.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyinstaller>=6.9" flask waitress certifi pillow
      - run: pyinstaller --onefile --noconsole --name Kinbox --icon server/static/icon.png --add-data "server/static;static" server/server.py
      - run: Compress-Archive -Path extension/* -DestinationPath dist/Kinbox-Extension.zip
      - run: gh release create "${{ github.ref_name }}" dist/Kinbox.exe dist/Kinbox-Extension.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
