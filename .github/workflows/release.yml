# Baut Kinbox.exe + Erweiterungs-ZIP + Android-App und legt ein GitHub-Release an, sobald ein Tag wie v3.3.0 gepusht wird.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyinstaller>=6.9" flask waitress certifi pillow
      - run: python .github/version_info.py "${{ github.ref_name }}"
      - run: pyinstaller --onefile --noconsole --name Kinbox --icon server/static/icon.png --version-file version.txt --add-data "server/static;static" server/server.py
      - run: Compress-Archive -Path extension/* -DestinationPath dist/Kinbox-Extension.zip
      # Android-App: nur mit Signaturschlüssel (Secrets KINBOX_KEYSTORE_B64 + KINBOX_KEYSTORE_PASSWORD),
      # sonst könnten Nutzer spätere Versionen nicht als Update installieren.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android-App bauen
        shell: bash
        env:
          KS: ${{ secrets.KINBOX_KEYSTORE_B64 }}
          KINBOX_KEYSTORE_PASSWORD: ${{ secrets.KINBOX_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then echo "::warning::Kein Signaturschlüssel – Release ohne Kinbox.apk"; exit 0; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/kinbox.jks"
          export KINBOX_KEYSTORE="$RUNNER_TEMP/kinbox.jks"
          cd android && ./gradlew assembleRelease --no-daemon
          cp build/outputs/apk/release/kinbox-release.apk ../dist/Kinbox.apk
      - run: gh release create "${{ github.ref_name }}" dist/Kinbox.exe dist/Kinbox-Extension.zip $(ls dist/Kinbox.apk 2>/dev/null) --generate-notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  docker:  # Image für NAS/Portainer: ghcr.io/<besitzer>/kinbox (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kinbox" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMG }}:latest,${{ env.IMG }}:${{ github.ref_name }}
